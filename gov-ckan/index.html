<title>GOV.UK CKAN OKF</title>
<script>
const sourceParams = new URLSearchParams(location.search);
const params = new URLSearchParams();
params.set('bundle', 'https://chris-page-gov.github.io/ai-engineering-lab-hackathon-london-2026/gov-ckan/okf-explorer.json');
params.set('view', sourceParams.get('view') || 'reader');
for (const [key, value] of sourceParams) {
  if (key !== 'bundle' && key !== 'view') params.append(key, value);
}
location.replace(
  'https://chris-page-gov.github.io/okf-explorer/' +
  '?' + params.toString() +
  location.hash
);
</script>
<p>Open <a href="https://chris-page-gov.github.io/okf-explorer/?bundle=https%3A%2F%2Fchris-page-gov.github.io%2Fai-engineering-lab-hackathon-london-2026%2Fgov-ckan%2Fokf-explorer.json&amp;view=reader#overview">GOV.UK CKAN in OKF Explorer</a>.</p>
